# Hangarr on Kubernetes: plain manifests (no kustomize). No namespace is
# set: they go to the namespace of `kubectl -n <ns>` or of your Argo CD
# application.
#
#   1. The image below is the public ghcr.io/migipasso/hangarr: set the release
#      tag you deploy (search "image:"). See docs/deployment.md, section 3.
#   2. Create the master key secret in the same namespace (never commit it):
#        kubectl -n <ns> create secret generic hangarr-master-key \
#          --from-literal=master-key="$(openssl rand -base64 32)"
#   3. kubectl -n <ns> apply -f deploy/kubernetes/hangarr.yaml (or sync Argo CD)
#   4. Initial admin password (shown once):
#        kubectl -n <ns> logs deploy/hangarr | grep -A4 "INITIAL ADMIN"
#   5. Open the app (port-forward, or the Service / Ingress you choose), then
#      configure Sonarr, Radarr, Plex (or Jellyfin) and Tautulli in Settings › Services
#      with their in-cluster addresses, e.g. http://sonarr:8989 in the same namespace.
#
# One replica only (SQLite on a ReadWriteOnce volume), Recreate strategy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hangarr-config
data:
  # Keep true until you really want deletions to happen.
  DRY_RUN: "true"
  PROTECTED_TAGS: "keep"
  TZ: "Europe/Paris"
  DEFAULT_LANG: "en"
  # true when the app is reached over HTTPS (Ingress, Tailscale) or through
  # `kubectl port-forward` on localhost; false only for plain HTTP elsewhere.
  COOKIE_SECURE: "true"
  # CIDR of the ingress controller / proxy pods allowed to send
  # X-Forwarded-For (empty: the TCP peer is the client).
  TRUSTED_PROXIES: ""
  LOG_FORMAT: "json"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hangarr-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi # database, image cache, backups; 10Gi for a large library
  # storageClassName: <your-storage-class>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hangarr
  labels:
    app.kubernetes.io/name: hangarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hangarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hangarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30 # the app drains for 20 s on SIGTERM
      containers:
        - name: hangarr
          image: ghcr.io/migipasso/hangarr:v1.3.1 # pin a release tag (avoid :latest)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hangarr-config
          env:
            - name: HANGARR_MASTER_KEY_FILE
              value: /run/secrets/hangarr/master-key
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - {
                name: master-key,
                mountPath: /run/secrets/hangarr,
                readOnly: true,
              }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hangarr-data
        - name: master-key
          secret:
            secretName: hangarr-master-key
            defaultMode: 0440 # readable by the fsGroup (65532), not only root
---
apiVersion: v1
kind: Service
metadata:
  name: hangarr
spec:
  selector:
    app.kubernetes.io/name: hangarr
  ports:
    - name: http
      port: 8080
      targetPort: http

# Real Jellyfin server (pinned version) with the scenario of testdata/jellyfin/.
# Nothing here is installed on the host: see `make jellyfin-lab`.
name: hangarr-jellyfin-lab

services:
  # Writes the scenario media (6-second videos, NFO files) into /media, then exits.
  media-init:
    image: jellyfin/jellyfin:12.4.20261026-211555@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    entrypoint: ["sh", "/lab/media-init.sh"]
    volumes:
      - ./media-init.sh:/lab/media-init.sh:ro
      - media:/media

  jellyfin:
    image: jellyfin/jellyfin:12.4.20261026-211555@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    depends_on:
      media-init:
        condition: service_completed_successfully
    ports:
      # Localhost only: the lab admin password is public.
      - "127.0.0.1:${LAB_PORT:-8096}:8096"
    volumes:
      - config:/config
      - cache:/cache
      - media:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 5s
      retries: 60

  # Startup wizard, libraries, users, playback state and the API key of hangarr.
  seed:
    image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    entrypoint: ["sh", "/lab/seed.sh"]
    environment:
      JELLYFIN_URL: http://jellyfin:8096
      LAB_PORT: ${LAB_PORT:-8096}
    volumes:
      - ./seed.sh:/lab/seed.sh:ro
      - out:/out
    depends_on:
      jellyfin:
        condition: service_healthy

  # Records the anonymized responses of the lab: `make jellyfin-lab-capture`.
  capture:
    profiles: [capture]
    image: golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
    working_dir: /src
    environment:
      GOFLAGS: -buildvcs=false
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_API_KEY_FILE: /out/api-key
      HOST_UID:
      HOST_GID:
    volumes:
      - ../..:/src
      - out:/out:ro
    command: ["sh", "-c", "go run ./cmd/capture-fixtures -out testdata/captured && chown -R \"$$HOST_UID:$$HOST_GID\" testdata/captured"]

volumes:
  config:
  cache:
  media:
  out:

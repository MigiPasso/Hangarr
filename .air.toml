# Hot reload for the `dev` stage (compose service `app`).
root = "."
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -o /go/bin/cleanarr ./cmd/cleanarr"
  entrypoint = ["/go/bin/cleanarr", "serve"]
  include_ext = ["go", "html", "css", "js", "sql", "txt"]
  exclude_dir = ["e2e", "testdata", "deploy", "tmp", ".git"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true
  # Bind mounts from macOS do not always forward inotify events.
  poll = true
  poll_interval = 1000

[log]
  time = false

[misc]
  clean_on_exit = true

# Development and test environment. Everything runs here: nothing is
# installed on the host besides Docker (see CONTRIBUTING.md).
name: hangarr-dev

x-upstreams-mock: &upstreams-mock
  SONARR_URL: http://mock:8989
  SONARR_API_KEY: mock-api-key
  RADARR_URL: http://mock:7878
  RADARR_API_KEY: mock-api-key
  PLEX_URL: http://mock:32400
  PLEX_TOKEN: mock-api-key
  TAUTULLI_URL: http://mock:8181
  TAUTULLI_API_KEY: mock-api-key

services:
  # Hot-reloaded app against the mock upstreams: `make dev`.
  app:
    build:
      context: .
      target: dev
    working_dir: /src
    environment:
      <<: *upstreams-mock
      # Media server, set by `MEDIA=plex|jellyfin|none make dev` (an empty value is unset).
      PLEX_URL: ${DEV_PLEX_URL-http://mock:32400}
      PLEX_TOKEN: ${DEV_PLEX_TOKEN-mock-api-key}
      TAUTULLI_URL: ${DEV_TAUTULLI_URL-http://mock:8181}
      TAUTULLI_API_KEY: ${DEV_TAUTULLI_API_KEY-mock-api-key}
      JELLYFIN_URL: ${DEV_JELLYFIN_URL-}
      JELLYFIN_API_KEY: ${DEV_JELLYFIN_API_KEY-}
      DATA_DIR: /data
      DRY_RUN: "true"
      COOKIE_SECURE: "false"
      LOG_FORMAT: text
      LOG_LEVEL: debug
      # Dev-only key: the services come from the environment (locked in the
      # UI), but public URLs and the webhook secret can be saved.
      HANGARR_MASTER_KEY: ZGV2LW9ubHktbWFzdGVyLWtleS0tZG8tbm90LXVzZSE=
      # Dev-only admin password (first start only, no forced change): admin / Hangarr-Dev-1.
      HANGARR_ADMIN_PASSWORD: &dev-admin-password Hangarr-Dev-1
    ports:
      # DEV_PORT=8081 make dev when 8080 is taken (e.g. by compose.yml).
      - "${DEV_PORT:-8080}:8080"
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
      - devdata:/data
    depends_on:
      - mock

  mock:
    build:
      context: .
      target: mock
    environment:
      MOCK_API_KEY: mock-api-key
      # Fixture history is anchored on 2026-10-01: shift it to today.
      MOCK_SHIFT_DATES: "true"
      # Dev only: the calendar's series and movies in the catalog, real posters
      # (TVmaze, IMDb) downloaded by the mock. `make e2e` turns both off.
      MOCK_DEV_EXTRAS: ${MOCK_DEV_EXTRAS:-true}
      MOCK_REAL_POSTERS: ${MOCK_REAL_POSTERS:-true}

  # Same app against real instances configured in .env: `make dev-real`.
  app-real:
    profiles: [real]
    build:
      context: .
      target: dev
    working_dir: /src
    # Makefile passes HANGARR_ENV_FILE=.env; the default keeps compose valid without .env.
    env_file: ${HANGARR_ENV_FILE:-.env.example}
    environment:
      DATA_DIR: /data
      HANGARR_ADMIN_PASSWORD: *dev-admin-password
      DRY_RUN: ${DRY_RUN:-true}
      COOKIE_SECURE: "false"
      LOG_FORMAT: text
    ports:
      - "8080:8080"
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
      - realdata:/data

  test:
    profiles: [tools]
    build:
      context: .
      target: test
    volumes:
      - gocache:/root/.cache/go-build

  lint:
    profiles: [tools]
    build:
      context: .
      target: lint
    volumes:
      - gocache:/root/.cache/go-build
      - lintcache:/root/.cache/golangci-lint

  # Records anonymized responses of the real instances: `make capture-fixtures`.
  capture:
    profiles: [real]
    image: golang:1.27.2-bookworm
    working_dir: /src
    env_file: ${HANGARR_ENV_FILE:-.env.example}
    environment:
      GOFLAGS: -buildvcs=false
      HOST_UID:
      HOST_GID:
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    command: ["sh", "-c", "go run ./cmd/capture-fixtures -out testdata/captured && chown -R \"$$HOST_UID:$$HOST_GID\" testdata/captured"]

  # Go toolbox with the source mounted, for go mod tidy and friends. Plain
  # image (not the deps stage) so it works before go.sum exists; keep the tag
  # in sync with GO_VERSION in the Dockerfile.
  gotools:
    profiles: [tools]
    image: golang:1.27.2-bookworm
    environment:
      GOFLAGS: -buildvcs=false
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build

  # The real runtime image (distroless, nonroot, read-only rootfs) on a blank
  # tmpfs database: e2e tests also prove Kubernetes compatibility.
  app-e2e:
    profiles: [e2e]
    build:
      context: .
      target: runtime
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0700
    environment:
      <<: *upstreams-mock
      DRY_RUN: "true"
      COOKIE_SECURE: "false"
      LOG_FORMAT: json
      LOGIN_MAX_PER_IP: "50"
      # The e2e assertions check the French interface (English is the default).
      DEFAULT_LANG: fr
    healthcheck:
      test: ["CMD", "/hangarr", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      - mock

  # Same image with DRY_RUN=false: e2e checks real deletions against the mock.
  app-e2e-live:
    profiles: [e2e]
    build:
      context: .
      target: runtime
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0700
    environment:
      <<: *upstreams-mock
      DRY_RUN: "false"
      # Admin password chosen by the operator: no banner, no forced change.
      HANGARR_ADMIN_PASSWORD: &live-admin-password Tr3s-Solide-Mot-De-Passe!
      COOKIE_SECURE: "false"
      LOG_FORMAT: json
      LOGIN_MAX_PER_IP: "50"
      # The e2e assertions check the French interface (English is the default).
      DEFAULT_LANG: fr
    healthcheck:
      test: ["CMD", "/hangarr", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      - mock

  # Same image without any service variable: the services are configured
  # from the UI; the master key comes from a Docker secret (_FILE variant).
  app-e2e-config:
    profiles: [e2e]
    build:
      context: .
      target: runtime
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0700
    secrets:
      - master_key
    environment:
      HANGARR_MASTER_KEY_FILE: /run/secrets/master_key
      DRY_RUN: "true"
      COOKIE_SECURE: "false"
      LOG_FORMAT: json
      LOGIN_MAX_PER_IP: "50"
      # The e2e assertions check the French interface (English is the default).
      DEFAULT_LANG: fr
    healthcheck:
      test: ["CMD", "/hangarr", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      - mock

  # Jellyfin only (no Plex, no Tautulli): the e2e checks Jellyfin is the server in use.
  app-e2e-jellyfin:
    profiles: [e2e]
    build:
      context: .
      target: runtime
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0700
    environment:
      SONARR_URL: http://mock:8989
      SONARR_API_KEY: mock-api-key
      RADARR_URL: http://mock:7878
      RADARR_API_KEY: mock-api-key
      JELLYFIN_URL: http://mock:8096
      JELLYFIN_API_KEY: mock-api-key
      DRY_RUN: "true"
      HANGARR_ADMIN_PASSWORD: &jellyfin-admin-password Jellyfin-Solide-Mot-De-Passe-42!
      COOKIE_SECURE: "false"
      LOG_FORMAT: json
      LOGIN_MAX_PER_IP: "50"
      DEFAULT_LANG: fr
    healthcheck:
      test: ["CMD", "/hangarr", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      - mock

  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /e2e
    environment:
      BASE_URL: http://app-e2e:8080
      BASE_URL_LIVE: http://app-e2e-live:8080
      BASE_URL_CONFIG: http://app-e2e-config:8080
      BASE_URL_JELLYFIN: http://app-e2e-jellyfin:8080
      MOCK_URL: http://mock:8989
      ADMIN_USERNAME: admin
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ADMIN_PASSWORD_LIVE: *live-admin-password
      ADMIN_PASSWORD_JELLYFIN: *jellyfin-admin-password
      ADMIN_INITIAL_PASSWORD_CONFIG: ${ADMIN_INITIAL_PASSWORD_CONFIG:-}
      CI: "1"
    volumes:
      - ./e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
      - npmcache:/root/.npm
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
    ipc: host

  # curl for vendoring static assets.
  fetch:
    profiles: [tools]
    image: curlimages/curl:8.22.0
    working_dir: /work
    volumes:
      - .:/work

secrets:
  # Test-only key (e2e/master.key), never used outside app-e2e-config.
  master_key:
    file: ./e2e/master.key

volumes:
  gomod:
  gocache:
  lintcache:
  devdata:
  realdata:
  e2e-node-modules:
  npmcache:

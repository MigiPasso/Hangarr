# Secret scanning (make secret-scan, CI). Default rules, plus an allowlist
# limited to the exact fake values the repository uses on purpose.
[extend]
useDefault = true

[[allowlists]]
description = "Fake values: dev-only master key of compose.dev.yml (decodes to 'dev-only-master-key--do-not-use!') and test API keys"
regexes = [
  '''^ZGV2LW9ubHktbWFzdGVyLWtleS0tZG8tbm90LXVzZSE=$''',
  '''^0123456789abcdef0123456789abcdef$''',
  '''^env-key-0123456789$''',
]

[[allowlists]]
description = "Not a secret: SHA-256 checksum of the public common passwords list (COMMON_PASSWORDS_SHA256 in the Makefile)"
regexes = [
  '''^68782d6a4a19a4768d5f15dd66bd534e7a33055cc755411e33f16d18c50fdcce$''',
]

# Production deployment with Docker: see docs/deployment.md, section 2.
#
#   cp .env.example .env                  # optional settings (DRY_RUN, COOKIE_SECURE, TZ…)
#   docker compose up -d                  # first start; pulls the published image
#   docker compose logs hangarr | grep -A4 "INITIAL ADMIN"     # initial admin password
#                                     (or set HANGARR_ADMIN_PASSWORD in .env before the first start)
#   To update: set HANGARR_IMAGE (or the default tag below) to the new release, then
#   docker compose pull && docker compose up -d
#
# Then open http://<host>:8080 and configure Sonarr, Radarr, Plex (or Jellyfin) and Tautulli in Settings › Services.
# `make deploy-check` validates this file and smoke-tests it against fake upstreams.
name: hangarr

services:
  hangarr:
    image: ${HANGARR_IMAGE:-ghcr.io/migipasso/hangarr:v1.3.1}
    container_name: hangarr
    restart: unless-stopped
    ports:
      - "${HANGARR_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      # The only writable path: database, image cache and, without
      # HANGARR_MASTER_KEY, the generated master key.
      - hangarr-data:/data
    # Same hardening as on Kubernetes.
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Healthcheck: built into the image (`hangarr healthcheck`).

    # --- Recommended: master key from a Docker secret, outside the data volume.
    # Generate it once: docker run --rm ghcr.io/migipasso/hangarr:v1.3.1 master-key > master.key
    # then uncomment the three lines below and the "secrets" block at the end.
    # secrets: [hangarr_master_key]
    # environment:
    #   HANGARR_MASTER_KEY_FILE: /run/secrets/hangarr_master_key

    # --- Optional: join the network of your Sonarr/Radarr/Plex (or Jellyfin)/Tautulli stack
    # to reach them by name (http://sonarr:8989) and let Tautulli call the
    # webhook (http://hangarr:8080/webhooks/tautulli). Uncomment with the
    # "networks" block at the end.
    # networks: [default, arr]

volumes:
  hangarr-data:

# networks:
#   arr:
#     external: true
#     name: arr_default        # `docker network ls` shows the name of your stack's network


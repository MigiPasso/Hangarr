# Production deployment with Docker: see README, « Déploiement avec Docker ».
#
#   cp .env.example .env                  # optional settings (DRY_RUN, COOKIE_SECURE, TZ…)
#   docker compose up -d --build          # first start, and updates from the sources
#   docker compose logs cleanarr | grep -A4 "COMPTE ADMIN"     # initial admin password
#
# Then open http://<host>:8080 and configure Sonarr, Radarr, Plex and Tautulli in « Configuration ».
# `make deploy-check` validates this file and smoke-tests it against fake upstreams.
name: cleanarr

services:
  cleanarr:
    image: ${CLEANARR_IMAGE:-cleanarr:local}
    build:
      context: .
      target: runtime
    container_name: cleanarr
    restart: unless-stopped
    ports:
      - "${CLEANARR_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      # The only writable path: database, image cache and, without
      # CLEANARR_MASTER_KEY, the generated master key.
      - cleanarr-data:/data
    # Same hardening as on Kubernetes.
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Healthcheck: built into the image (`cleanarr healthcheck`).

    # --- Recommended: master key from a Docker secret, outside the data volume.
    # Generate it once: docker run --rm cleanarr:local master-key > master.key
    # then uncomment the three lines below and the « secrets » block at the end.
    # secrets: [cleanarr_master_key]
    # environment:
    #   CLEANARR_MASTER_KEY_FILE: /run/secrets/cleanarr_master_key

    # --- Optional: join the network of your Sonarr/Radarr/Plex/Tautulli stack
    # to reach them by name (http://sonarr:8989) and let Tautulli call the
    # webhook (http://cleanarr:8080/webhooks/tautulli). Uncomment with the
    # « networks » block at the end.
    # networks: [default, arr]

volumes:
  cleanarr-data:

# networks:
#   arr:
#     external: true
#     name: arr_default        # `docker network ls` shows the name of your stack's network

# secrets:
#   cleanarr_master_key:
#     file: ./master.key

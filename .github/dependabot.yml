# Weekly update pull requests for Go modules and the pinned GitHub Actions.
# Not covered on purpose, bumped by hand because each version lives in two
# places (see CONTRIBUTING.md): Go and golangci-lint (Dockerfile,
# compose.dev.yml), Playwright (compose.dev.yml, e2e/package.json), htmx
# (Makefile).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
